#################################
# OUTPUTS / INPUT / WORKSPACES
#################################

output DP-3 mode 2560x1440@179.999Hz pos 0 0 scale 1
output HDMI-A-1 mode 1920x1080@59.997Hz pos 320 1440 scale 1.25
output * allow_tearing yes

input * {
    xkb_layout us,br
    xkb_options caps:escape
    repeat_delay 300
    repeat_rate 40
    accel_profile flat
}

exec swaymsg create_output

workspace 1  output DP-3
workspace 2  output DP-3
workspace 3  output DP-3
workspace 4  output DP-3
workspace 5  output DP-3
workspace 6  output DP-3
workspace 7  output DP-3
workspace 8  output DP-3 
workspace 9  output DP-3 
workspace 10 output DP-3 

workspace 11 output HDMI-A-1
workspace 12 output HDMI-A-1
workspace 13 output HDMI-A-1
workspace 14 output HDMI-A-1
workspace 15 output HDMI-A-1
workspace 16 output HDMI-A-1
workspace 17 output HDMI-A-1
workspace 18 output HDMI-A-1
workspace 19 output HDMI-A-1
workspace 20 output HDMI-A-1
