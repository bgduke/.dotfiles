[font]
size = 11.0

[font.normal]
family = "ZedMono Nerd Font"

[window]
dimensions = { columns = 120, lines = 32 }
padding = { x = 5, y = 5 }
decorations = "None"

[scrolling]
history = 10000

[cursor]
style = { shape = "Beam", blinking = "Never" }
thickness = 0.15

[colors.primary]
foreground = "#D8DEE9"
background = "#2E3440"

[colors.cursor]
text = "#2E3440"
cursor = "#D8DEE9"

[colors.selection]
text = "#D8DEE9"
background = "#4C566A"

[colors.normal]
black = "#3B4252"
red = "#BF616A"
green = "#A3BE8C"
yellow = "#EBCB8B"
blue = "#81A1C1"
magenta = "#B48EAD"
cyan = "#88C0D0"
white = "#E5E9F0"

[colors.bright]
black = "#4C566A"
red = "#BF616A"
green = "#A3BE8C"
yellow = "#EBCB8B"
blue = "#81A1C1"
magenta = "#B48EAD"
cyan = "#8FBCBB"
white = "#ECEFF4"

[keyboard]
bindings = [
  { key = "C", mods = "Control|Shift", action = "Copy" },
  { key = "V", mods = "Control|Shift", action = "Paste" },

  { key = "_", mods = "Control|Shift", action = "DecreaseFontSize" },
  { key = "+", mods = "Control|Shift", action = "IncreaseFontSize" },

  # Desabilita zoom padrão aproximado
  { key = "-", mods = "Control", action = "None" },
  { key = "=", mods = "Control", action = "None" },
]
